---
# Runs locked, network-independent VerityCX quality gates on every supported host.
name: quality
on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: .
jobs:
  verify:
    name: verify (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v6
      - name: Verify formatter text normalization
        run: |
          attribute_output="$(git check-attr eol -- README.md specs/001-acquire-tau3-banking/tasks.md .github/workflows/README.md .github/workflows/quality.yml)"
          printf '%s\n' "$attribute_output"
          test "$(printf '%s\n' "$attribute_output" | grep -c 'eol: lf$')" -eq 4
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv 0.12.5
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.12.5"
      - name: Record environment and require Git 2.34
        env:
          MATRIX_RUNNER: ${{ matrix.runner }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          : "${ImageOS:?GitHub-hosted ImageOS is unavailable}"
          : "${ImageVersion:?GitHub-hosted ImageVersion is unavailable}"
          printf 'matrix_runner=%s runner_name=%s runner_os=%s runner_arch=%s image_os=%s image_version=%s\n' "$MATRIX_RUNNER" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
          python --version
          git --version
          uv --version
          python -c "import re, subprocess, sys; text = subprocess.check_output(['git', '--version'], text=True); match = re.search(r'(\\d+)\\.(\\d+)', text); sys.exit(0 if match and tuple(map(int, match.groups())) >= (2, 34) else 1)"
      - name: Verify lock and synchronize
        run: |
          uv lock --check
          uv sync --locked
      - name: Record network-independent first-acquisition duration
        timeout-minutes: 11
        run: uv run pytest -q -s tests/data_sources/test_tau3.py::test_first_install_promotes_only_a_fully_validated_checkout
      - name: Run Python quality gates
        run: |
          uv run ruff format --check src scripts tests
          uv run ruff check src scripts tests
          uv run mypy --strict src scripts tests
          uv run pytest tests -m "not support_db and not live"
      - name: Check maintained Markdown
        run: |
          uv run mdformat --check README.md THIRD_PARTY_NOTICES.md config/README.md docs/data/tau3-banking.md
          uv run mdformat --check .specify/memory/constitution.md docs/README.md docs/project-vision.md tests/README.md
          uv run mdformat --check scripts/README.md src/veritycx/README.md src/veritycx/data_sources/README.md tests/data_sources/README.md
          uv run mdformat --check specs/001-acquire-tau3-banking/spec.md specs/001-acquire-tau3-banking/plan.md specs/001-acquire-tau3-banking/research.md specs/001-acquire-tau3-banking/data-model.md specs/001-acquire-tau3-banking/quickstart.md specs/001-acquire-tau3-banking/tasks.md
          uv run mdformat --check specs/001-acquire-tau3-banking/contracts/configuration.md specs/001-acquire-tau3-banking/contracts/data-use-policy.md specs/001-acquire-tau3-banking/contracts/inspection-cli.md specs/001-acquire-tau3-banking/contracts/setup-cli.md .github/workflows/README.md
          uv run mdformat --check specs/001-acquire-tau3-banking/checklists/comprehensive.md specs/001-acquire-tau3-banking/checklists/requirements.md
          uv run mdformat --check docs/platform-roadmap.md docs/platform-design.md docs/threat-model.md specs/002-durable-knowledge-support
          uv run mdformat --check src scripts tests config docs
      - name: Check workflow formatting
        run: uv run yamlfix --check .github/workflows/quality.yml .github/workflows/support-integration.yml
